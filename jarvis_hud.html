<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STARK INTERFACE // SERVER CORE v27.0</title>
    <style>
        body { 
            background-color: #020813; 
            color: #00e5ff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px; 
            overflow: hidden; 
            height: 100vh; 
            box-sizing: border-box; 
            background-image: linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px); 
            background-size: 30px 30px; 
        }
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        .hud-banner { display: flex; justify-content: space-between; border-bottom: 2px solid rgba(0, 229, 255, 0.4); padding-bottom: 10px; color: #00a8cc; font-size: 12px; font-weight: bold; }
        .clock { color: #00e5ff; }
        .hud-container { display: flex; gap: 20px; height: calc(100vh - 100px); margin-top: 20px; }
        .hud-widget-side { width: 30%; border: 1px solid rgba(0, 229, 255, 0.2); background: rgba(2, 16, 35, 0.6); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .arc-reactor-ring { width: 140px; height: 140px; border: 4px dashed #00e5ff; border-radius: 50%; animation: rotate 12s linear infinite; }
        .hud-main-side { width: 70%; display: flex; flex-direction: column; }
        .terminal-output { flex-grow: 1; background-color: rgba(2, 11, 24, 0.85); border: 1px solid rgba(0, 229, 255, 0.3); padding: 20px; overflow-y: auto; border-radius: 6px; color: #8be9fd; font-family: monospace; font-size: 14px; line-height: 1.6; }
        .input-bar { margin-top: 15px; display: flex; background: rgba(5, 24, 41, 0.8); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 6px; padding: 5px 15px; gap: 10px; align-items: center; }
        .main-input { flex-grow: 1; background: transparent; border: none; color: #fff; padding: 10px 0; font-size: 15px; outline: none; }
        .send-btn { background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff; color: #00e5ff; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="hud-banner">
        <div>STARK_CORE // CLOUD_SERVER_MATRIX // v27.0</div>
        <div style="color: #00ff66;">HOST_STATUS: SECURE PUBLIC SERVER ACTIVE</div>
        <div class="clock" id="chrono">SYS_TIME: --:--:--</div>
    </div>
    <div class="hud-container">
        <div class="hud-widget-side"><div class="arc-reactor-ring"></div></div>
        <div class="hud-main-side">
            <div class="terminal-output" id="terminalLog">
                <span style="color: #00a8cc;">[OK] SERVER NODE ESTABLISHED SUCCESSFULLY.</span><br>
                <span style="color: #00e5ff; font-weight: bold;">[JARVIS]: Cloud architecture verified, Sir. Browser desktop firewalls are non-existent here. Type any inquiry below and hit Enter.</span><br>
            </div>
            <div class="input-bar">
                <div style="color: #00e5ff; font-weight: bold; font-family: monospace;">JARVIS &gt;</div>
                <input type="text" class="main-input" id="cmdInput" placeholder="ENTER CLOUD OVERLINK DIRECTIVE..." autofocus autocomplete="off">
                <button class="send-btn" onclick="executeDirective()">SEND</button>
            </div>
        </div>
    </div>
    <script>
        setInterval(() => { document.getElementById('chrono').innerText = "SYS_TIME: " + new Date().toLocaleTimeString(); }, 1000);
        
        function jarvisSpeak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
            }
        }

        async function queryAI(userPrompt) {
            const log = document.getElementById('terminalLog');
            log.innerHTML += `<br><span style="color: #00a8cc;">[THINKING] Processing network transmission nodes...</span>`;
            log.scrollTop = log.scrollHeight;

            const systemContext = "You are JARVIS, the legendary AI companion engineered by Tony Stark from Iron Man. Keep replies punchy, highly analytical, and always call the user Sir.";
            const targetUrl = `https://pollinations.ai{encodeURIComponent(systemContext + " User prompt: " + userPrompt)}`;
            
            try {
                // Running from a server means the browser cleanly passes fetch requests without CORS blocking
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Link latency failure.");
                let aiResponse = await response.text();
                
                aiResponse = aiResponse.replace(/\*/g, '');

                log.innerHTML += `<br><span style="color: #00e5ff; font-weight: bold;">[JARVIS]: ${aiResponse}</span>`;
                jarvisSpeak(aiResponse);

            } catch (error) {
                log.innerHTML += `<br><span style="color: #ff5555;">[CRITICAL ERROR]: Frame delivery fault. Endpoint unreadable.</span>`;
                jarvisSpeak("Server transmission broken, Sir.");
            }
            log.scrollTop = log.scrollHeight;
        }

        function executeDirective() {
            const input = document.getElementById('cmdInput');
            const log = document.getElementById('terminalLog');
            let val = input.value.trim();
            if(!val) return;

            log.innerHTML += `<br><span style="color:#fff;">User &gt; ${val}</span>`;
            input.value = "";

            if (val.toLowerCase() === 'clear') {
                log.innerHTML = `<span style="color:#00e5ff; font-weight:bold;">[JARVIS]: Terminal memory cells wiped, Sir.</span><br>`;
                jarvisSpeak("Logs cleared.");
            } else {
                queryAI(val);
            }
            log.scrollTop = log.scrollHeight;
        }

        document.getElementById('cmdInput').addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') {
                e.preventDefault();
                executeDirective();
            }
        });
    </script>
</body>
</html>
